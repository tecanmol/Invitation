<!doctype html>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061826">
<meta name="description" content="An invitation to celebrate Ganesh Utsav with the Pandey Family.">
<title>Invitation from Pandey Family</title>

<!-- WhatsApp / Facebook Link Preview -->
<meta property="og:title" content="Invitation from Pandey Family">
<meta property="og:description" content="Join us in celebrating Ganesh Utsav with the Pandey Family.">
<meta property="og:image" content="https://anmol.runs-on.dev/assets/images/invitation-preview.jpg">
<meta property="og:url" content="https://anmol.runs-on.dev/">
<meta property="og:type" content="website">

<!-- Optional: helps Twitter/X and other platforms -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Invitation from Pandey Family">
<meta name="twitter:description" content="You are warmly invited to celebrate Ganesh Utsav with the Pandey Family.">
<meta name="twitter:image" content="https://anmol.runs-on.dev/assets/images/ganpati-hero.webp">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="preload" as="image" href="assets/images/ganpati-hero.webp" fetchpriority="high">
</head>
<body>
<!-- ============ THE WORLD ============ -->
<div class="world" aria-hidden="true">
  <div class="world__sky"></div>
  <div class="world__bloom world__bloom--a"></div>
  <div class="world__bloom world__bloom--b"></div>
  <div class="world__air" id="air"></div>
  <div class="world__vignette"></div>
  <div class="world__garlands" id="garlands"></div>
</div>
<!-- flower petals, falling on every card -->
<div class="petals" id="petals" aria-hidden="true"></div>
<!-- ============ THE INVITATION ============ -->
<main class="frame" id="frame">
  <div class="topbar">
    <button class="music" id="musicBtn" type="button" hidden aria-pressed="false" aria-label="Play music">
      <svg class="music__on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M9 18.2V7.4l10-2v10.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="7" cy="18.4" r="2.4" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="17" cy="15.8" r="2.4" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      <svg class="music__off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M9 18.2V7.4l10-2v10.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="7" cy="18.4" r="2.4" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="17" cy="15.8" r="2.4" stroke="currentColor" stroke-width="1.6"/>
        <path d="M3.5 3.5 20.5 20.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="stage" id="stage">
    <div class="deck" id="deck" role="group" aria-roledescription="invitation deck" aria-label="Invitation cards"></div>
    <div class="teach" id="teach" hidden aria-hidden="true">
      <div class="teach__hand">
        <svg viewBox="0 0 56 66" fill="none" aria-hidden="true">
          <path d="M22 42V15a3.6 3.6 0 0 1 7.2 0v9.6a3.6 3.6 0 0 1 7.2 0v2.8a3.6 3.6 0 0 1 7.2 0v12.4
                   c0 8.4-5.6 14.6-14 14.6h-2.2c-3.6 0-6.6-1.4-9.1-4L11.4 41.6a4.1 4.1 0 0 1 5.8-5.8L22 40.4Z"
                fill="#FFF8E8" stroke="currentColor" stroke-width="2"
                stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="controls">
    <p class="hint" id="hint" aria-live="polite"></p>
    <div class="nav">
      <button class="pad pad--back" id="prevBtn" type="button" aria-label="Previous card">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M14.5 5.5 8 12l6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="beads" id="beads"></div>
      <button class="pad pad--next" id="nextBtn" type="button" aria-label="Next card">
        <span class="pad__word" id="nextWord">Next</span>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9.5 5.5 16 12l-6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
  <p class="sr" aria-live="polite" id="srStatus"></p>
</main>
<!-- ============ THE OPENING PAGE ============ -->
<div class="opening" id="curtain">
  <div class="opening__paper"></div>
  <div class="opening__fold"></div>
  <div class="opening__inner">
    <div class="opening__mark" id="curtainMark"></div>
    <p class="opening__eyebrow" id="curtainMantra"></p>
    <h1 class="opening__family" id="curtainInvites"></h1>
    <div class="opening__rule"><span></span><i></i><span></span></div>
    <p class="opening__note" id="curtainNote"></p>
    <div class="opening__cta">
      <button class="openbtn" id="openBtn" type="button">
        <span id="openLabel">Open Invitation</span>
      </button>
      <div class="tapper" aria-hidden="true">
        <span class="tapper__ring"></span>
        <span class="tapper__ring tapper__ring--b"></span>
        <svg class="tapper__hand" viewBox="0 0 56 70" fill="none">
          <path d="M22 44V16.5a3.7 3.7 0 0 1 7.4 0v9.8a3.7 3.7 0 0 1 7.4 0v2.9a3.7 3.7 0 0 1 7.4 0v12.7
                   c0 8.6-5.7 15-14.3 15h-2.3c-3.7 0-6.8-1.4-9.3-4.1L11.2 43.6a4.2 4.2 0 0 1 5.9-5.9L22 42.3Z"
                fill="#FFFBF0" stroke="#5A4113" stroke-width="2.1"
                stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>
</div>
<noscript>
  <div class="noscript"><p>Please turn on JavaScript to open this invitation.</p></div>
</noscript>
<script src="edit/content.js"></script>
<script src="app.js"></script>
</body>
</html>
